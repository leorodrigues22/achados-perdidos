<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Publicar | AchaIFSC</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="wrap top">
    <a class="logo" href="index.html">🔎 <strong>AchaIFSC</strong></a>
    <nav>
      <a href="index.html">Início</a>
      <a href="meus-anuncios.html">Meus anúncios</a>
    </nav>
  </div>
</header>

<main class="wrap formPage">
  <div>
    <p class="tag">Nova publicação</p>
    <h1>Conte o que aconteceu</h1>
    <p>Preencha os dados abaixo e o anúncio ficará salvo online.</p>
  </div>

  <form id="postForm" class="panel">
    <div class="typeRow">
      <label><input type="radio" name="tipo" value="perdido" checked> 🔴 Perdi</label>
      <label><input type="radio" name="tipo" value="encontrado"> 🟢 Encontrei</label>
    </div>

    <div class="two">
      <label>Objeto *
        <input name="titulo" required placeholder="Ex.: Garrafa preta">
      </label>

      <label>Categoria *
        <select name="categoria" required>
          <option value="">Selecione</option>
          <option>Eletrônicos</option>
          <option>Material escolar</option>
          <option>Roupas</option>
          <option>Documentos</option>
          <option>Chaves</option>
          <option>Garrafas e copos</option>
          <option>Outros</option>
        </select>
      </label>

      <label>Local *
        <input name="local" required placeholder="Ex.: Biblioteca">
      </label>

      <label>Data *
        <input id="data" name="data" type="date" required>
      </label>
    </div>

    <label>Descrição *
      <textarea name="descricao" maxlength="500" required placeholder="Cor, marca, detalhes..."></textarea>
    </label>

    <label>Contato *
      <input name="contato" required placeholder="Instagram, e-mail ou outro contato">
    </label>

    <label>Foto
      <input id="foto" type="file" accept="image/*">
    </label>

    <div id="preview" class="preview hidden"></div>

    <button class="btn" type="submit">Publicar</button>
    <p id="msg" class="msg"></p>

    <div id="aiStatus" class="ai-status hidden"></div>
    <div id="matchBox" class="ai-match-box hidden"></div>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/common.js"></script>
<script src="js/ai-match.js"></script>
<script src="js/publicar.js"></script>
</body>
</html>
